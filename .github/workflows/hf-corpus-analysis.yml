name: HF Corpus Analysis

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Corpus tier to run when corpus=all"
        type: choice
        default: representative
        options:
          - smoke
          - representative
          - full
      corpus:
        description: "Specific corpus id, or all"
        type: string
        default: all
      registry_repo:
        description: "Optional HF dataset repo containing corpora.json. Empty uses repo-local registry."
        type: string
        default: ""
      registry_revision:
        description: "HF registry dataset revision/branch when registry_repo is set."
        type: string
        default: main
      force:
        description: "Rerun analysis even when published fingerprints match."
        type: boolean
        default: false
  schedule:
    # Weekly full public-corpus validation. Manual dispatch can run it sooner.
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/hf-corpus-analysis.yml"
      - "docs/corpora/public-hf-analysis-corpora.json"
      - "middens/**"
      - "scripts/fetch_hf_corpus_registry.py"
      - "scripts/hf_corpus_matrix.py"
      - "scripts/materialize_hf_analysis_corpus.py"
      - "scripts/extract_public_corpus_metrics.py"
      - "scripts/build_public_results_site.py"
      - "scripts/build_public_comparative_metrics.py"
      - "scripts/public_results_fingerprint.py"
      - "scripts/public_results_changed.py"
      - "scripts/interpret_public_corpus.py"
      - "scripts/interpret_public_comparison.py"
      - "docs/prompts/public-corpus-interpretation-v1.md"
      - "docs/prompts/public-comparative-interpretation-v1.md"
      - "tests/test_extract_public_corpus_metrics.py"
      - "tests/test_build_public_results_site.py"
      - "tests/test_build_public_comparative_metrics.py"
      - "tests/test_public_results_fingerprint.py"
      - "tests/test_interpret_public_corpus.py"
      - "tests/test_interpret_public_comparison.py"
      - "todos/public-results-*.md"

permissions:
  contents: write

concurrency:
  group: hf-corpus-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Select corpora
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve registry
        id: registry
        run: |
          mkdir -p .tmp/registry
          REGISTRY="docs/corpora/public-hf-analysis-corpora.json"
          HF_REPO=""
          HF_REVISION="main"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HF_REPO="${{ inputs.registry_repo }}"
            HF_REVISION="${{ inputs.registry_revision }}"
          elif [ -n "${{ vars.HF_CORPUS_REGISTRY_REPO }}" ]; then
            HF_REPO="${{ vars.HF_CORPUS_REGISTRY_REPO }}"
            HF_REVISION="${{ vars.HF_CORPUS_REGISTRY_REVISION }}"
            if [ -z "$HF_REVISION" ]; then
              HF_REVISION="main"
            fi
          fi
          if [ -n "$HF_REPO" ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install huggingface_hub
            python3 scripts/fetch_hf_corpus_registry.py \
              --repo-id "$HF_REPO" \
              --revision "$HF_REVISION" \
              --output .tmp/registry/corpora.json
            REGISTRY=".tmp/registry/corpora.json"
          else
            cp "$REGISTRY" .tmp/registry/corpora.json
            REGISTRY=".tmp/registry/corpora.json"
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TIER="smoke"
            CORPUS="all"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            TIER="full"
            CORPUS="all"
          else
            TIER="${{ inputs.tier }}"
            CORPUS="${{ inputs.corpus }}"
          fi
          MATRIX="$(python3 scripts/hf_corpus_matrix.py --registry "${{ steps.registry.outputs.registry }}" --tier "$TIER" --corpus "$CORPUS")"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload resolved registry
        uses: actions/upload-artifact@v4
        with:
          name: hf-corpus-registry
          path: .tmp/registry/corpora.json
          if-no-files-found: error

  analyze:
    name: Analyze ${{ matrix.id }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.tmp/xdg-data/${{ matrix.id }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MIDDENS_CORPUS_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub pyarrow

      - name: Download resolved registry
        uses: actions/download-artifact@v4
        with:
          name: hf-corpus-registry
          path: .tmp/registry

      - name: Materialize pinned HF corpus
        run: |
          python scripts/materialize_hf_analysis_corpus.py \
            --registry ".tmp/registry/corpora.json" \
            --corpus "${{ matrix.id }}" \
            --output ".tmp/hf-corpora/${{ matrix.id }}" \
            --cache-dir ".tmp/hf-cache" \
            --force

      - name: Fetch previous published public-safe bundle
        if: ${{ github.event_name != 'pull_request' && github.repository == 'Lightless-Labs/third-thoughts' }}
        run: |
          set -euo pipefail
          mkdir -p ".tmp/previous-site/corpora/${{ matrix.id }}"
          if git ls-remote --exit-code origin refs/heads/www >/dev/null 2>&1; then
            git fetch --depth=1 origin www
            for file in corpus.json analysis-manifest.json split-manifest.json metrics.json status.json fingerprints.json interpretation.md; do
              if git cat-file -e "FETCH_HEAD:downloads/corpora/${{ matrix.id }}/$file" 2>/dev/null; then
                git show "FETCH_HEAD:downloads/corpora/${{ matrix.id }}/$file" > ".tmp/previous-site/corpora/${{ matrix.id }}/$file"
              fi
            done
          fi

      - name: Compute current public result fingerprints
        run: |
          python scripts/public_results_fingerprint.py \
            --corpus-id "${{ matrix.id }}" \
            --registry ".tmp/registry/corpora.json" \
            --materialized-corpus ".tmp/hf-corpora/${{ matrix.id }}" \
            --output ".tmp/current-fingerprints/${{ matrix.id }}.json"

      - name: Decide whether previous bundle is reusable
        id: reuse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE="${{ inputs.force }}"
          else
            FORCE="false"
          fi
          if [ "$FORCE" = "true" ]; then
            {
              echo "changed=true"
              echo "reusable=false"
              echo "reason=force_requested"
            } >> "$GITHUB_OUTPUT"
          else
            python scripts/public_results_changed.py \
              --current ".tmp/current-fingerprints/${{ matrix.id }}.json" \
              --previous ".tmp/previous-site/corpora/${{ matrix.id }}/fingerprints.json" \
              --scope analysis \
              --github-output "$GITHUB_OUTPUT"
          fi
          if grep -q '^reusable=true$' "$GITHUB_OUTPUT"; then
            mkdir -p ".tmp/site-data/corpora"
            cp -R ".tmp/previous-site/corpora/${{ matrix.id }}" ".tmp/site-data/corpora/${{ matrix.id }}"
            echo "Reusing previous public-safe bundle for ${{ matrix.id }}"
          else
            echo "Previous bundle not reusable for ${{ matrix.id }}"
          fi

      - name: Install Rust toolchain
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: middens

      - name: Install uv
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        uses: astral-sh/setup-uv@v5

      - name: Build middens
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        working-directory: middens
        run: cargo build --release --locked

      - name: Run full analysis battery (no LLM interpretation)
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        run: |
          ./middens/target/release/middens analyze \
            ".tmp/hf-corpora/${{ matrix.id }}" \
            --all \
            --timeout 1800 \
            --force \
            --output ".tmp/middens-results/${{ matrix.id }}"

      - name: Resolve latest analysis directory
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        id: latest
        run: |
          ROOT="$XDG_DATA_HOME/com.lightless-labs.third-thoughts/analysis"
          ANALYSIS_DIR="$(find "$ROOT" -maxdepth 1 -type d -name 'run-*' | sort | tail -n 1)"
          if [ -z "$ANALYSIS_DIR" ]; then
            echo "No analysis run found under $ROOT" >&2
            exit 1
          fi
          echo "analysis_dir=$ANALYSIS_DIR" >> "$GITHUB_OUTPUT"
          echo "Analysis dir: $ANALYSIS_DIR"

      - name: Export notebook without interpretation
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        run: |
          ./middens/target/release/middens export \
            --analysis-dir "${{ steps.latest.outputs.analysis_dir }}" \
            --no-interpretation \
            --output ".tmp/reports/${{ matrix.id }}.ipynb" \
            --force

      - name: Validate analysis manifest shape
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          analysis_dir = pathlib.Path(os.environ["ANALYSIS_DIR"])
          manifest = json.loads((analysis_dir / "manifest.json").read_text())
          techniques = manifest.get("techniques", [])
          if len(techniques) != 23:
              raise SystemExit(f"expected 23 techniques, got {len(techniques)}")
          missing = [t.get("name") for t in techniques if "summary" not in t]
          if missing:
              raise SystemExit(f"technique entries missing summary: {missing}")
          print(f"validated {len(techniques)} techniques for {os.environ['MIDDENS_CORPUS_ID']}")
          PY
        env:
          ANALYSIS_DIR: ${{ steps.latest.outputs.analysis_dir }}

      - name: Run HF split stratification smoke
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        id: split_latest
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${{ github.workspace }}/.tmp/xdg-split/${{ matrix.id }}"
          ./middens/target/release/middens analyze \
            ".tmp/hf-corpora/${{ matrix.id }}" \
            --split \
            --no-python \
            --output ".tmp/middens-split-results/${{ matrix.id }}"
          python - <<'PY'
          import json, os, pathlib
          corpus_id = os.environ["MIDDENS_CORPUS_ID"]
          output = pathlib.Path(".tmp/middens-split-results") / corpus_id
          for name in ["interactive", "subagent", "autonomous"]:
              if not (output / name).is_dir():
                  raise SystemExit(f"missing split output directory: {output / name}")
          root = pathlib.Path(os.environ["XDG_DATA_HOME"]) / "com.lightless-labs.third-thoughts" / "analysis"
          runs = sorted(root.glob("run-*"))
          if not runs:
              raise SystemExit(f"no split analysis run found under {root}")
          split_dir = runs[-1]
          manifest = json.loads((split_dir / "manifest.json").read_text())
          strata = manifest.get("strata") or []
          names = sorted(s.get("name") for s in strata)
          expected = ["autonomous", "interactive", "subagent"]
          if names != expected:
              raise SystemExit(f"expected strata {expected}, got {names}")
          for stratum in strata:
              ref = split_dir / stratum["manifest_ref"]
              if not ref.exists():
                  raise SystemExit(f"missing stratum manifest: {ref}")
              if not isinstance(stratum.get("session_count"), int) or stratum["session_count"] < 0:
                  raise SystemExit(f"invalid session_count in {stratum}")
          print(f"validated split strata for {corpus_id}: {strata}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              print(f"split_dir={split_dir}", file=fh)
          PY

      - name: Extract public-safe site data
        if: ${{ steps.reuse.outputs.reusable != 'true' }}
        run: |
          python scripts/extract_public_corpus_metrics.py \
            --corpus-id "${{ matrix.id }}" \
            --registry ".tmp/registry/corpora.json" \
            --analysis-output ".tmp/middens-results/${{ matrix.id }}" \
            --split-output ".tmp/middens-split-results/${{ matrix.id }}" \
            --analysis-dir "${{ steps.latest.outputs.analysis_dir }}" \
            --split-analysis-dir "${{ steps.split_latest.outputs.split_dir }}" \
            --materialized-corpus ".tmp/hf-corpora/${{ matrix.id }}" \
            --output ".tmp/site-data/corpora/${{ matrix.id }}"

      - name: Interpret public-safe corpus metrics
        if: ${{ github.event_name != 'pull_request' && github.repository == 'Lightless-Labs/third-thoughts' && vars.PUBLIC_RESULTS_INTERPRET_COMMAND != '' && vars.PUBLIC_RESULTS_INTERPRET_MODEL != '' }}
        run: |
          python scripts/interpret_public_corpus.py \
            --corpus-dir ".tmp/site-data/corpora/${{ matrix.id }}" \
            --prompt "docs/prompts/public-corpus-interpretation-v1.md" \
            --model "${{ vars.PUBLIC_RESULTS_INTERPRET_MODEL }}" \
            --runner-command "${{ vars.PUBLIC_RESULTS_INTERPRET_COMMAND }}"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-corpus-analysis-${{ matrix.id }}
          path: |
            .tmp/middens-results/${{ matrix.id }}/
            .tmp/middens-split-results/${{ matrix.id }}/
            .tmp/site-data/corpora/${{ matrix.id }}/
            .tmp/current-fingerprints/${{ matrix.id }}.json
            .tmp/reports/${{ matrix.id }}.ipynb
          if-no-files-found: warn

  build-site:
    name: Build public results site
    needs: analyze
    runs-on: ubuntu-latest
    if: ${{ needs.analyze.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download per-corpus analysis artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hf-corpus-analysis-*
          path: .tmp/public-results-artifacts

      - name: Collect public-safe site data
        run: |
          set -euo pipefail
          mkdir -p site-data/corpora
          found=0
          while IFS= read -r metrics; do
            corpus_dir="$(dirname "$metrics")"
            corpus_id="$(basename "$corpus_dir")"
            rm -rf "site-data/corpora/$corpus_id"
            mkdir -p "site-data/corpora/$corpus_id"
            cp "$corpus_dir"/*.json "site-data/corpora/$corpus_id/"
            if [ -f "$corpus_dir/interpretation.md" ]; then
              cp "$corpus_dir/interpretation.md" "site-data/corpora/$corpus_id/"
            fi
            found=$((found + 1))
          done < <(find .tmp/public-results-artifacts \( -path '*/site-data/corpora/*/metrics.json' -o -path '*/.tmp/site-data/corpora/*/metrics.json' \) | sort)
          if [ "$found" -eq 0 ]; then
            echo "No public-safe site-data bundles found in downloaded artifacts" >&2
            exit 1
          fi
          echo "Collected $found corpus bundles"

      - name: Build comparative public metrics
        run: |
          python scripts/build_public_comparative_metrics.py \
            --corpora-dir site-data/corpora \
            --output site-data/comparative

      - name: Interpret comparative public-safe metrics
        if: ${{ github.event_name != 'pull_request' && github.repository == 'Lightless-Labs/third-thoughts' && vars.PUBLIC_RESULTS_COMPARATIVE_INTERPRET_COMMAND != '' && vars.PUBLIC_RESULTS_COMPARATIVE_INTERPRET_MODEL != '' }}
        run: |
          python scripts/interpret_public_comparison.py \
            --comparative-dir "site-data/comparative" \
            --prompt "docs/prompts/public-comparative-interpretation-v1.md" \
            --model "${{ vars.PUBLIC_RESULTS_COMPARATIVE_INTERPRET_MODEL }}" \
            --runner-command "${{ vars.PUBLIC_RESULTS_COMPARATIVE_INTERPRET_COMMAND }}"

      - name: Build public results site
        run: |
          python scripts/build_public_results_site.py \
            --site-data site-data \
            --output site-out

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: public-results-site
          path: site-out/
          if-no-files-found: error

      - name: Deploy generated site to www branch
        if: ${{ github.event_name != 'pull_request' && github.repository == 'Lightless-Labs/third-thoughts' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site-out
          touch .nojekyll
          git init
          git checkout -b www
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update public results site"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" www
